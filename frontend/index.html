<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RUTLAND TERMINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://js.stripe.com/v3/"></script>

<style>
/* ===== BASE ===== */
body{
  margin:0;
  background:#000;
  font-family:Segoe UI,Arial,sans-serif;
  color:#e6f0ff;
}
.center{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.panel{
  width:420px;
  background:linear-gradient(180deg,#07121f,#02070d);
  border-radius:12px;
  padding:22px;
  box-shadow:0 0 30px rgba(0,255,120,.15);
}
.title{
  font-size:22px;
  text-align:center;
  margin-bottom:14px;
}
label{
  font-size:12px;
  color:#8fb4ff;
}
input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:14px;
  background:#081626;
  border:1px solid #20344f;
  border-radius:8px;
  color:white;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#18a84a;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#1fc35c;}
#error{color:#ff4d4d;text-align:center;}

.statusbar{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:12px;
}
.online{color:#00ff9c;}

#card-element{
  padding:12px;
  background:#081626;
  border-radius:8px;
  border:1px solid #20344f;
  color:white;
}

#receiptStatus{
  background:#081626;
  padding:10px;
  border-radius:6px;
  margin-top:10px;
  text-align:center;
}

/* ===== RECEIPT ===== */
#receiptArea{
  display:none;
  width:58mm;
  font-family:monospace;
  font-size:12px;
  color:#000;
}
.receipt{padding:6px;}
.line{border-top:1px dashed #000;margin:6px 0;}
.centerText{text-align:center;}

/* ===== PRINT FIX ===== */
@media print{
  body{
    background:#fff !important;
  }
  body *{
    visibility:hidden !important;
  }
  #receiptArea, #receiptArea *{
    visibility:visible !important;
  }
  #receiptArea{
    position:absolute;
    left:0;
    top:0;
    width:58mm;
    background:#fff !important;
    color:#000 !important;
  }
}
</style>
</head>

<body>

<div class="center">

<!-- LOGIN -->
<div class="panel" id="loginScreen">
  <div class="title">RUTLAND TERMINAL</div>
  <label>USERNAME</label>
  <input id="loginUser">
  <label>PIN</label>
  <input id="loginPin" type="password" maxlength="4">
  <button id="loginBtn">LOGIN</button>
  <div id="error"></div>
</div>

<!-- TERMINAL -->
<div class="panel" id="terminalScreen" style="display:none;">

<div class="statusbar">
  <span>Terminal: <span class="online">ONLINE</span></span>
  <span>Backend: <span class="online">ONLINE</span></span>
  <span>Cloud: <span class="online">CONNECTED</span></span>
</div>

<div class="title">RUTLAND LTD</div>

<label>CARD DETAILS</label>
<div id="card-element"></div>

<label>AMOUNT</label>
<input id="amount" type="number" step="0.01">

<label>CURRENCY</label>
<select id="currency">
  <option>USD</option>
  <option>EUR</option>
  <option>GBP</option>
</select>

<label>PROTOCOL</label>
<select id="protocol">
  <option>101.1 Online Sale</option>
  <option>101.2 Purchase</option>
  <option>101.3 Online Sale 6D</option>
  <option>101.4 Online Purchase</option>
  <option>101.5 Mail Order</option>
  <option>101.6 PreAuth</option>
  <option>101.7 Forced Sale</option>
  <option>101.8 PIN Less</option>
  <option>201.1 One Step Completion</option>
  <option>201.2 Offline Forced</option>
  <option>201.3 Offline</option>
  <option>201.4 Ticket / Phone</option>
  <option>201.5 PreAuth Multiple</option>
</select>

<label>AUTH CODE</label>
<input id="authCode" maxlength="6">

<button id="processBtn">PROCESS TRANSACTION</button>
<div id="receiptStatus">NO TRANSACTION</div>
<button onclick="window.print()">PRINT RECEIPT</button>

</div>
</div>

<!-- RECEIPT -->
<div id="receiptArea">
<div class="receipt">
<div class="centerText"><b>RUTLAND POS</b></div>
<div class="centerText">MERCHANT COPY</div>
<div class="line"></div>
Date: <span id="r_date"></span><br>
Txn ID: <span id="r_txn"></span><br>
Protocol: <span id="r_proto"></span><br>
Card: **** **** **** <span id="r_pan"></span><br>
Amount: <span id="r_cur"></span> <span id="r_amt"></span><br>
Auth Code: <span id="r_auth"></span><br>
<div class="line"></div>
APPROVED
</div>
</div>

<script>
/* LOGIN */
loginBtn.onclick=()=>{
  if(loginUser.value==="admin" && loginPin.value==="9767"){
    loginScreen.style.display="none";
    terminalScreen.style.display="block";
  }else{
    error.innerText="INVALID LOGIN";
  }
};

/* STRIPE */
const stripe = Stripe("pk_live_51Six8wHBVxJlYpDD6WCpcbcPj154xNJnVQuJiwTPiBNFJ5rMy2lPV2Abf2eHrIPCmJN9MKFL0FFS7oUY7Ej7uwNt00bJXcqgNW");
const elements = stripe.elements();

const card = elements.create("card",{
  hidePostalCode:true,
  style:{
    base:{
      color:"#ffffff",
      fontSize:"16px",
      "::placeholder":{color:"#9bbcff"}
    },
    invalid:{color:"#ff4d4d"}
  }
});
card.mount("#card-element");

/* PROCESS */
processBtn.onclick=async()=>{
  receiptStatus.innerText="PROCESSING...";
  const {paymentMethod,error}=await stripe.createPaymentMethod({type:"card",card});
  if(error){receiptStatus.innerText=error.message;return;}

  const res=await fetch("/api/transactions",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      payment_method_id:paymentMethod.id,
      amount:amount.value,
      currency:currency.value,
      protocol:protocol.value,
      auth_code:authCode.value,
      terminal_id:"RTL-001"
    })
  });

  const d=await res.json();
  if(d.status==="APPROVED"){
    receiptStatus.innerText="APPROVED";
    r_date.innerText=new Date().toLocaleString();
    r_txn.innerText=d.txn_id;
    r_proto.innerText=protocol.value;
    r_pan.innerText=d.last4;
    r_amt.innerText=d.amount;
    r_cur.innerText=currency.value;
    r_auth.innerText=authCode.value;
  }else{
    receiptStatus.innerText="DECLINED: "+d.reason;
  }
};
</script>

</body>
</html>
