<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Backend Monitor</title>
  <script>
    function reload() { location.reload(); }
    setInterval(reload, 5000);
  </script>
</head>
<body>
  <h1>Monitor</h1>
  <p>Last: {{ now }}</p>

  <h2>Last transactions</h2>
  <pre>{{ transactions | tojson(indent=2) }}</pre>

  <h2>Last payouts</h2>
  <pre>{{ payouts | tojson(indent=2) }}</pre>
</body>
</html>
