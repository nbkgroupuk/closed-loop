# nginx config (reverse proxy, assumes gateway serves at / on port 8000)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    upstream gateway_up {
        server project-gateway:8000;
    }

    server {
        listen 80;
        server_name _;  # replace with your domain
        # Redirect HTTP to HTTPS (enable after certs created)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;  # replace with your domain

        ssl_certificate /etc/letsencrypt/live/nbkgroup.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nbkgroup.co.uk/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://gateway_up;
        }
    }
}
