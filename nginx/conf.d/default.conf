server {
    listen 80;

    location /health {
        proxy_pass http://project-backend:8000/health;
    }

    location /stripe/webhook {
        proxy_pass http://project-backend:8000/stripe/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://project-backend:8000/;
    }

    location /transactions {
        proxy_pass http://project-gateway:8000/transactions;
    }

    location /payout {
        proxy_pass http://project-gateway:8000/payout;
    }

    location / {
        proxy_pass http://project-frontend:80;
    }
}
