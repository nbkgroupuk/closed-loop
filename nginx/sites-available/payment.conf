server {
    listen 80;
    server_name payment.example.com  _;   # replace payment.example.com with your hostname or IP

    root /var/www/payment-frontend;       # <-- update to path where index-new.html build files are copied
    index index.html;

    # Serve static files (SPA friendly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy -> backend/gateway (adjust host:port if your gateway listens elsewhere)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;           # backend (FastAPI / gateway)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        # prevent buffering for low-latency endpoints (optional)
        proxy_buffering off;
    }

    # If your app exposes /transactions and /payout without /api prefix, forward them as well
    location /transactions {
        proxy_pass http://127.0.0.1:8000/transactions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /payout {
        proxy_pass http://127.0.0.1:8000/payout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # WebSocket path used by frontend (mapped to backend)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional proxy for crypto service if frontend calls it directly
    location /crypto/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Cache static assets lightly
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Increase client body size for large payloads (ISO20022 XML or file uploads)
    client_max_body_size 10M;

    # Security best-practices (minimal)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "no-referrer-when-downgrade";
}
