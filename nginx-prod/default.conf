server {
    listen 80;
    server_name _;

    location /healthz {
        proxy_pass http://project-gateway:8000/healthz;
    }

    location /transactions {
        proxy_pass http://project-gateway:8000/transactions;
    }

    location /payout {
        proxy_pass http://crypto-payout:9001/payout;
    }

    location /ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://project-gateway:8000/ws;
    }
}
